name: Build Android (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Release APK'
        required: true
        type: boolean
        default: true
      build_aab:
        description: 'Build Release App Bundle (AAB)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AZURE_FUNCTION_URL=${{ secrets.AZURE_FUNCTION_URL }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          echo "GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}" >> .env

      - name: Decode Android Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Verify Keystore Setup
        run: |
          if [ -f "android/key.properties" ] && [ -f "android/app/upload-keystore.jks" ]; then
            echo "✅ Keystore found and configured. Building with release signature."
          else
            echo "⚠️ Keystore not found. Building with fallback signing to ensure installable APK."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        if: ${{ inputs.build_apk }}
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        if: ${{ inputs.build_aab }}
        run: flutter build appbundle --release

      - name: Upload Release APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release App Bundle (AAB)
        if: ${{ inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
