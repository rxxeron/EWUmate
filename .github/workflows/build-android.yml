name: "Build Android Release"
run-name: "Android Build: EWUmate (${{ github.ref_name }}) by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'App Version Name override (e.g. 1.2.0, leave empty to use pubspec.yaml)'
        required: false
        type: string
        default: ''
      build_apk:
        description: 'Build Release APK'
        required: true
        type: boolean
        default: true
      build_aab:
        description: 'Build Release App Bundle (AAB)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract App Version
        id: app_version
        run: |
          DEFAULT_VER=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          CUSTOM_VER="${{ inputs.build_name }}"
          if [ -n "$CUSTOM_VER" ]; then
            VERSION="$CUSTOM_VER"
          else
            VERSION="$DEFAULT_VER"
          fi
          BUILD_NUM=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "✅ Selected App Version: ${VERSION} (Build: ${BUILD_NUM})"

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://jwygjihrbwxhehijldiz.supabase.co' }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3eWdqaWhyYnd4aGVoaWpsZGl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDQxNzQsImV4cCI6MjA4NjY4MDE3NH0.zQc3dq53HBpMeN0rbJA9soF0oYhl7de1_sNnB_9JPoM' }}" >> .env
          echo "AZURE_FUNCTION_URL=${{ secrets.AZURE_FUNCTION_URL || 'https://ewumate-parser-api.azurewebsites.net' }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || '561956344734-ulqeqls9u4h1hmpec41l9lufk336a9ga.apps.googleusercontent.com' }}" >> .env
          echo "GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID || '561956344734-tserledl1nlsae5g46eaqfmbf31npvaf.apps.googleusercontent.com' }}" >> .env

      - name: Setup Android Keystore and Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "✅ Keystore found and configured. Building with release signature."
          else
            echo "⚠️ Keystore secret not set. Building with fallback signing to ensure installable APK."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        if: ${{ inputs.build_apk }}
        run: |
          if [ -n "${{ inputs.build_name }}" ]; then
            flutter build apk --release --build-name="${{ inputs.build_name }}"
          else
            flutter build apk --release
          fi

      - name: Build Release App Bundle (AAB)
        if: ${{ inputs.build_aab }}
        run: |
          if [ -n "${{ inputs.build_name }}" ]; then
            flutter build appbundle --release --build-name="${{ inputs.build_name }}"
          else
            flutter build appbundle --release
          fi

      - name: Upload Release APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: EWUmate-v${{ steps.app_version.outputs.version }}-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release App Bundle (AAB)
        if: ${{ inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: EWUmate-v${{ steps.app_version.outputs.version }}-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
